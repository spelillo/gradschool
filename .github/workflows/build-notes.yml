name: Rebuild notes

# Regenerates notes-data.js whenever a note is pushed, so index.html stays in sync.
on:
  push:
    branches: [main]
    paths:
      - "**/notes/**.md"
      - "build_notes.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuild-notes
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # full history so each note gets its real last-edited date

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Bundle notes
        run: python3 build_notes.py

      - name: Commit notes-data.js if it changed
        run: |
          if git diff --quiet -- notes-data.js; then
            echo "notes-data.js already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add notes-data.js
          git commit -m "Rebuild notes-data.js"
          git pull --rebase origin main
          git push origin HEAD:main
