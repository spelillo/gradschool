<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notes Hub</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script src="notes-data.js"></script>
<script src="config.js"></script><!-- optional, git-ignored: holds your Groq key -->
<style>
:root {
  --bg: #f6f5f1; --panel: #ffffff; --ink: #1d1d1f; --muted: #6b6b70; --line: #e4e2dc;
  --accent: #3b5bdb; --accent-soft: #e8ecfd; --mark: #ffe58a; --mark-active: #ffb84d;
  --code-bg: #f1f0ec; --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141416; --panel: #1c1c1f; --ink: #ececef; --muted: #9a9aa2; --line: #2c2c31;
    --accent: #7c95ff; --accent-soft: #252b45; --mark: #6b5a12; --mark-active: #a8661a;
    --code-bg: #232327; --shadow: 0 1px 2px rgba(0,0,0,.3);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; }
button { font: inherit; color: inherit; cursor: pointer; }
input, textarea { font: inherit; color: inherit; }

/* Top bar */
.topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 14px;
  padding: 10px 20px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line); }
.brand { font-weight: 700; letter-spacing: -.02em; font-size: 17px; cursor: pointer; white-space: nowrap; }
.brand span { color: var(--accent); }
.search { flex: 1; max-width: 560px; display: flex; align-items: center; gap: 6px; background: var(--panel);
  border: 1px solid var(--line); border-radius: 10px; padding: 0 6px 0 12px; }
.search input { flex: 1; border: 0; background: transparent; padding: 9px 0; outline: none; min-width: 0; }
.search .count { color: var(--muted); font-size: 12px; white-space: nowrap; }
.icon-btn { border: 0; background: transparent; padding: 6px 8px; border-radius: 7px; color: var(--muted); }
.icon-btn:hover { background: var(--accent-soft); color: var(--accent); }
.btn { border: 1px solid var(--line); background: var(--panel); padding: 7px 12px; border-radius: 9px; white-space: nowrap; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.spacer { flex: 1; }
.progress { position: absolute; left: 0; bottom: -1px; height: 2px; background: var(--accent); width: 0; transition: width .1s; }

/* Home */
.home { max-width: 1100px; margin: 0 auto; padding: 32px 20px 60px; }
.home h1 { font-size: 28px; letter-spacing: -.02em; margin: 0 0 4px; }
.home .sub { color: var(--muted); margin: 0 0 24px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; cursor: pointer;
  box-shadow: var(--shadow); transition: transform .12s, border-color .12s; display: flex; flex-direction: column; gap: 8px; }
.card:hover { transform: translateY(-2px); border-color: var(--accent); }
.card h3 { margin: 0; font-size: 17px; letter-spacing: -.01em; }
.card .file { font-size: 12px; color: var(--muted); font-family: ui-monospace, Menlo, monospace; }
.card p { margin: 0; color: var(--muted); font-size: 14px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.card .meta { font-size: 12px; color: var(--muted); display: flex; gap: 12px; margin-top: auto; }
.card mark { background: var(--mark); color: inherit; border-radius: 3px; }
.empty { text-align: center; color: var(--muted); padding: 60px 20px; border: 1px dashed var(--line); border-radius: 14px; }
.empty code { background: var(--code-bg); padding: 2px 6px; border-radius: 5px; }

/* Reader layout */
.reader { display: grid; grid-template-columns: 230px minmax(0, 1fr) 380px; height: calc(100vh - 57px); }
.reader.ai-closed { grid-template-columns: 230px minmax(0, 1fr) 0; }
.toc { border-right: 1px solid var(--line); overflow-y: auto; padding: 20px 14px; font-size: 13px; }
.toc h4 { margin: 0 0 10px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.toc a { display: block; padding: 4px 8px; border-radius: 6px; color: var(--muted); text-decoration: none; border-left: 2px solid transparent; }
.toc a:hover { color: var(--ink); background: var(--accent-soft); }
.toc a.active { color: var(--accent); border-left-color: var(--accent); background: var(--accent-soft); }
.toc a.h3 { padding-left: 20px; } .toc a.h4 { padding-left: 32px; }
.toc .notes-list { margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--line); }
.toc .notes-list a.current { color: var(--ink); font-weight: 600; }

.doc-scroll { overflow-y: auto; scroll-behavior: smooth; position: relative; }
.doc { max-width: 760px; margin: 0 auto; padding: 36px 32px 120px; }
.doc .crumbs { font-size: 13px; color: var(--muted); margin-bottom: 18px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.doc .crumbs a { color: var(--accent); text-decoration: none; cursor: pointer; }
.md h1 { font-size: 32px; letter-spacing: -.025em; line-height: 1.2; margin: 0 0 18px; }
.md h2 { font-size: 22px; letter-spacing: -.015em; margin: 36px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.md h3 { font-size: 18px; margin: 26px 0 8px; }
.md h1, .md h2, .md h3, .md h4 { scroll-margin-top: 20px; }
.md p, .md li { font-size: 16px; }
.md a { color: var(--accent); }
.md code { background: var(--code-bg); padding: 2px 6px; border-radius: 5px; font-size: .9em; font-family: ui-monospace, Menlo, monospace; }
.md pre { background: var(--code-bg); padding: 14px 16px; border-radius: 10px; overflow-x: auto; }
.md pre code { background: none; padding: 0; }
.md table { border-collapse: collapse; width: 100%; margin: 14px 0; font-size: 14px; display: block; overflow-x: auto; }
.md th, .md td { border: 1px solid var(--line); padding: 8px 12px; text-align: left; }
.md th { background: var(--code-bg); }
.md blockquote { margin: 16px 0; padding: 4px 16px; border-left: 3px solid var(--accent); color: var(--muted); }
.md img { max-width: 100%; border-radius: 8px; }
.md mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 1px; }
.md mark.active { background: var(--mark-active); outline: 2px solid var(--mark-active); }
.pager { display: flex; justify-content: space-between; gap: 12px; margin-top: 48px; padding-top: 20px; border-top: 1px solid var(--line); }
.pager .btn { max-width: 48%; overflow: hidden; text-overflow: ellipsis; }

.float-btns { position: fixed; right: 400px; bottom: 22px; display: flex; flex-direction: column; gap: 8px; z-index: 10; transition: right .2s; }
.reader.ai-closed ~ .float-btns { right: 22px; }
.float-btns button { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel); box-shadow: var(--shadow); font-size: 16px; }
.float-btns button:hover { border-color: var(--accent); color: var(--accent); }

/* AI panel */
.ai { border-left: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
.ai-head { padding: 14px 16px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px; }
.ai-head strong { font-size: 14px; }
.ai-head .ctx { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.chip { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 5px 11px; font-size: 12.5px; }
.chip:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.msgs { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.msg { padding: 10px 13px; border-radius: 12px; font-size: 14px; line-height: 1.55; max-width: 100%; overflow-wrap: anywhere; }
.msg.user { background: var(--accent); color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; max-width: 88%; }
.msg.bot { background: var(--bg); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
.msg.bot p:first-child { margin-top: 0; } .msg.bot p:last-child { margin-bottom: 0; }
.msg.bot ul, .msg.bot ol { padding-left: 20px; }
.msg.bot pre { background: var(--code-bg); padding: 10px; border-radius: 8px; overflow-x: auto; font-size: 12.5px; }
.msg.bot code { font-size: 12.5px; }
.msg.bot table { border-collapse: collapse; font-size: 12.5px; display: block; overflow-x: auto; margin: 8px 0; }
.msg.bot th, .msg.bot td { border: 1px solid var(--line); padding: 5px 8px; text-align: left; vertical-align: top; min-width: 70px; }
.msg.bot th { background: var(--code-bg); }
.msg.err { background: #fde8e8; color: #9b1c1c; border: 1px solid #f5c2c2; }
@media (prefers-color-scheme: dark) { .msg.err { background: #3a1717; color: #f5b5b5; border-color: #5a2323; } }
.ai-hint { color: var(--muted); font-size: 13px; text-align: center; margin: auto 0; padding: 20px; }
.composer { border-top: 1px solid var(--line); padding: 12px; display: flex; gap: 8px; align-items: flex-end; }
.composer textarea { flex: 1; resize: none; border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; background: var(--bg);
  outline: none; max-height: 140px; min-height: 40px; }
.composer textarea:focus { border-color: var(--accent); }
.typing::after { content: "▍"; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }

.hidden { display: none !important; }

@media (max-width: 1100px) {
  .reader, .reader.ai-closed { grid-template-columns: minmax(0, 1fr) 0; }
  .reader:not(.ai-closed) { grid-template-columns: minmax(0,1fr); }
  .toc { display: none; }
  .ai { position: fixed; right: 0; top: 57px; bottom: 0; width: min(400px, 100vw); z-index: 30; box-shadow: -8px 0 30px rgba(0,0,0,.15); }
  .reader.ai-closed .ai { display: none; }
  .float-btns, .reader.ai-closed ~ .float-btns { right: 16px; }
  .doc { padding: 24px 16px 100px; }
}
@media (max-width: 600px) { .topbar { padding: 10px 12px; gap: 8px; } .brand { font-size: 15px; } #openFolderBtn { display: none; } }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand" id="brand">Notes<span>Hub</span></div>
  <div class="search">
    <span aria-hidden="true">⌕</span>
    <input id="search" type="search" placeholder="Search all notes…" autocomplete="off">
    <span class="count" id="searchCount"></span>
    <button class="icon-btn hidden" id="prevMatch" title="Previous match (Shift+Enter)">↑</button>
    <button class="icon-btn hidden" id="nextMatch" title="Next match (Enter)">↓</button>
  </div>
  <div class="spacer"></div>
  <button class="btn" id="openFolderBtn" title="Load .md files from a folder without rebuilding">Open folder</button>
  <button class="btn primary hidden" id="aiToggle">✦ AI</button>
  <input type="file" id="folderInput" webkitdirectory multiple class="hidden">
  <div class="progress" id="progress"></div>
</header>

<!-- Home -->
<main class="home" id="home">
  <h1>Your notes</h1>
  <p class="sub" id="homeSub"></p>
  <div class="grid" id="grid"></div>
</main>

<!-- Reader -->
<div class="reader hidden" id="reader">
  <nav class="toc" id="toc"></nav>
  <div class="doc-scroll" id="docScroll">
    <article class="doc">
      <div class="crumbs"><a id="backHome">← All notes</a><span>/</span><span id="crumbFile"></span></div>
      <div class="md" id="md"></div>
      <div class="pager" id="pager"></div>
    </article>
  </div>
  <aside class="ai" id="ai">
    <div class="ai-head">
      <div style="min-width:0;flex:1">
        <strong>✦ Study assistant</strong>
        <div class="ctx" id="aiCtx"></div>
      </div>
      <button class="icon-btn" id="aiClear" title="Clear chat">⟲</button>
      <button class="icon-btn" id="aiClose" title="Hide panel">✕</button>
    </div>
    <div class="chips" id="chips"></div>
    <div class="msgs" id="msgs"></div>
    <form class="composer" id="composer">
      <textarea id="prompt" rows="1" placeholder="Ask about this note…"></textarea>
      <button class="btn primary" type="submit" id="sendBtn">Send</button>
    </form>
  </aside>
</div>
<div class="float-btns hidden" id="floatBtns">
  <button id="toTop" title="Back to top">↑</button>
  <button id="toBottom" title="Jump to bottom">↓</button>
</div>

<script>
/* ---------- Config ---------- */
// The key comes from config.js (git-ignored) or is entered once in the AI panel and saved in this browser.
function getKey() {
  if (window.GROQ_API_KEY) return window.GROQ_API_KEY;
  try { return localStorage.getItem("groqApiKey") || ""; } catch { return ""; }
}
function askForKey() {
  const k = prompt("Paste your Groq API key (starts with gsk_). It is saved only in this browser.");
  if (k && k.trim()) { try { localStorage.setItem("groqApiKey", k.trim()); } catch {} window.GROQ_API_KEY = k.trim(); }
  return getKey();
}
const GROQ_URL = "https://api.groq.com/openai/v1/chat/completions";
let GROQ_MODEL = "llama-3.3-70b-versatile";

const QUICK_PROMPTS = [
  ["Summarize", "Summarize this note in 5–7 concise bullet points, keeping the most important facts."],
  ["Practice questions", "Write 5 practice questions based on this note, mixing multiple choice and short answer. Put the answers in a separate 'Answer key' section at the end."],
  ["Flashcards", "Create 8 flashcards from this note. Format each as **Q:** … then **A:** … on the next line."],
  ["Explain simply", "Explain the main ideas of this note as if I'm seeing them for the first time. Use a simple analogy."],
  ["Key terms", "List the key terms in this note with a one-line definition for each."],
  ["Quiz me", "Quiz me on this note one question at a time. Ask the first question only, then wait for my answer and tell me if I'm right before asking the next."],
];

/* ---------- State ---------- */
let notes = (window.NOTES || []).map(n => ({ ...n }));
let current = null;           // current note object
let chat = [];                // [{role, content}]
let matches = [], matchIdx = -1;
let busy = false;

const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const renderMd = md => DOMPurify.sanitize(marked.parse(md, { gfm: true }));
const stripMd = md => md.replace(/```[\s\S]*?```/g, " ").replace(/[#>*_`|\-\[\]()!]/g, " ").replace(/\s+/g, " ").trim();
const words = md => stripMd(md).split(" ").filter(Boolean).length;
const slug = (t, used) => { let s = t.toLowerCase().replace(/[^\w]+/g, "-").replace(/^-|-$/g, "") || "section"; let k = s, i = 2; while (used.has(k)) k = `${s}-${i++}`; used.add(k); return k; };

/* ---------- Home ---------- */
function renderHome(query = "") {
  const q = query.trim().toLowerCase();
  const grid = $("grid");
  if (!notes.length) {
    $("homeSub").textContent = "No notes loaded yet.";
    grid.innerHTML = `<div class="empty" style="grid-column:1/-1">Put .md files in a <code>notes</code> folder and run <code>python3 build_notes.py</code>,<br>or click <b>Open folder</b> above to load a folder directly.</div>`;
    return;
  }
  const list = notes.filter(n => !q || n.title.toLowerCase().includes(q) || n.content.toLowerCase().includes(q));
  $("homeSub").textContent = q ? `${list.length} of ${notes.length} notes match “${query.trim()}”` : `${notes.length} note${notes.length === 1 ? "" : "s"} · pick one to start reading`;
  $("searchCount").textContent = q ? `${list.length} found` : "";
  if (!list.length) { grid.innerHTML = `<div class="empty" style="grid-column:1/-1">No notes match “${esc(query)}”.</div>`; return; }
  grid.innerHTML = list.map(n => {
    const plain = stripMd(n.content.replace(/^#\s.*$/m, ""));
    let snippet = plain.slice(0, 220);
    if (q) {
      const i = plain.toLowerCase().indexOf(q);
      if (i > -1) snippet = (i > 60 ? "…" : "") + plain.slice(Math.max(0, i - 60), i + 160);
    }
    let html = esc(snippet);
    if (q) html = html.replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi"), m => `<mark>${m}</mark>`);
    return `<div class="card" data-file="${esc(n.file)}" tabindex="0">
      <h3>${esc(n.title)}</h3>
      <div class="file">${esc(n.file)}</div>
      <p>${html}</p>
      <div class="meta"><span>${words(n.content)} words</span><span>${(n.content.match(/^#{2,3}\s/gm) || []).length} sections</span>${n.modified ? `<span>${n.modified.slice(0, 10)}</span>` : ""}</div>
    </div>`;
  }).join("");
}
$("grid").addEventListener("click", e => { const c = e.target.closest(".card"); if (c) location.hash = "#/note/" + encodeURIComponent(c.dataset.file); });
$("grid").addEventListener("keydown", e => { if (e.key === "Enter") e.target.closest(".card")?.click(); });

/* ---------- Reader ---------- */
function openNote(file) {
  const n = notes.find(x => x.file === file);
  if (!n) { location.hash = ""; return; }
  const changed = current !== n;
  current = n;
  document.title = `${n.title} · Notes Hub`;
  $("crumbFile").textContent = n.file;
  $("md").innerHTML = renderMd(n.content);

  // headings → ids + TOC
  const used = new Set();
  const heads = [...$("md").querySelectorAll("h1,h2,h3,h4")];
  heads.forEach(h => h.id = slug(h.textContent, used));
  const tocLinks = heads.map(h => `<a href="#" data-target="${h.id}" class="${h.tagName.toLowerCase()}">${esc(h.textContent)}</a>`).join("");
  const others = notes.map(x => `<a href="#/note/${encodeURIComponent(x.file)}" class="${x === n ? "current" : ""}">${esc(x.title)}</a>`).join("");
  $("toc").innerHTML = `<h4>On this page</h4>${tocLinks || '<span style="color:var(--muted)">No headings</span>'}<div class="notes-list"><h4>All notes</h4>${others}</div>`;

  // pager
  const i = notes.indexOf(n), prev = notes[i - 1], next = notes[i + 1];
  $("pager").innerHTML = (prev ? `<button class="btn" data-file="${esc(prev.file)}">← ${esc(prev.title)}</button>` : "<span></span>")
                       + (next ? `<button class="btn" data-file="${esc(next.file)}">${esc(next.title)} →</button>` : "<span></span>");

  $("aiCtx").textContent = `Context: ${n.title}`;
  if (changed) { chat = []; renderChat(); $("docScroll").scrollTop = 0; }
  $("search").value = ""; clearHighlights(); updateSearchUi();
  updateProgress(); updateTocActive();
}
$("toc").addEventListener("click", e => {
  const a = e.target.closest("a[data-target]"); if (!a) return;
  e.preventDefault(); document.getElementById(a.dataset.target)?.scrollIntoView({ behavior: "smooth", block: "start" });
});
$("pager").addEventListener("click", e => { const b = e.target.closest("button[data-file]"); if (b) location.hash = "#/note/" + encodeURIComponent(b.dataset.file); });
$("backHome").onclick = () => location.hash = "";
$("brand").onclick = () => location.hash = "";

/* scroll progress + active TOC */
function updateProgress() {
  const s = $("docScroll"), max = s.scrollHeight - s.clientHeight;
  $("progress").style.width = (max > 0 ? (s.scrollTop / max) * 100 : 0) + "%";
}
function updateTocActive() {
  const s = $("docScroll"), top = s.getBoundingClientRect().top + 40;
  let active = null;
  $("md").querySelectorAll("h1,h2,h3,h4").forEach(h => { if (h.getBoundingClientRect().top <= top) active = h.id; });
  $("toc").querySelectorAll("a[data-target]").forEach(a => a.classList.toggle("active", a.dataset.target === active));
}
$("docScroll").addEventListener("scroll", () => { updateProgress(); updateTocActive(); }, { passive: true });
$("toTop").onclick = () => $("docScroll").scrollTo({ top: 0, behavior: "smooth" });
$("toBottom").onclick = () => $("docScroll").scrollTo({ top: $("docScroll").scrollHeight, behavior: "smooth" });

/* ---------- In-note search ---------- */
function clearHighlights() {
  $("md").querySelectorAll("mark").forEach(m => m.replaceWith(document.createTextNode(m.textContent)));
  $("md").normalize(); matches = []; matchIdx = -1;
}
function highlight(q) {
  clearHighlights();
  if (!q) return;
  const ql = q.toLowerCase();
  const walker = document.createTreeWalker($("md"), NodeFilter.SHOW_TEXT);
  const nodes = []; while (walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(node => {
    const text = node.nodeValue, lower = text.toLowerCase();
    if (!lower.includes(ql)) return;
    const frag = document.createDocumentFragment(); let pos = 0, i;
    while ((i = lower.indexOf(ql, pos)) > -1) {
      frag.append(text.slice(pos, i));
      const m = document.createElement("mark"); m.textContent = text.slice(i, i + q.length); frag.append(m); matches.push(m);
      pos = i + q.length;
    }
    frag.append(text.slice(pos)); node.replaceWith(frag);
  });
  if (matches.length) gotoMatch(0);
}
function gotoMatch(i) {
  if (!matches.length) return;
  matches[matchIdx]?.classList.remove("active");
  matchIdx = (i + matches.length) % matches.length;
  matches[matchIdx].classList.add("active");
  matches[matchIdx].scrollIntoView({ behavior: "smooth", block: "center" });
  updateSearchUi();
}
function updateSearchUi() {
  const inNote = !!current && !$("reader").classList.contains("hidden");
  const has = inNote && $("search").value.trim();
  $("prevMatch").classList.toggle("hidden", !has); $("nextMatch").classList.toggle("hidden", !has);
  if (inNote) $("searchCount").textContent = has ? (matches.length ? `${matchIdx + 1} / ${matches.length}` : "0 results") : "";
  $("search").placeholder = inNote ? "Search in this note…" : "Search all notes…";
}
let searchTimer;
$("search").addEventListener("input", () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    if (current && !$("reader").classList.contains("hidden")) { highlight($("search").value.trim()); updateSearchUi(); }
    else renderHome($("search").value);
  }, 120);
});
$("search").addEventListener("keydown", e => {
  if (e.key === "Enter" && current && !$("reader").classList.contains("hidden")) { e.preventDefault(); gotoMatch(matchIdx + (e.shiftKey ? -1 : 1)); }
  if (e.key === "Escape") { $("search").value = ""; $("search").dispatchEvent(new Event("input")); $("search").blur(); }
});
$("prevMatch").onclick = () => gotoMatch(matchIdx - 1);
$("nextMatch").onclick = () => gotoMatch(matchIdx + 1);
document.addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "f" && !$("reader").classList.contains("hidden")) { e.preventDefault(); $("search").focus(); $("search").select(); }
  if (e.key === "/" && document.activeElement.tagName !== "INPUT" && document.activeElement.tagName !== "TEXTAREA") { e.preventDefault(); $("search").focus(); }
});

/* ---------- AI panel ---------- */
$("chips").innerHTML = QUICK_PROMPTS.map(([label], i) => `<button class="chip" data-i="${i}">${label}</button>`).join("");
$("chips").addEventListener("click", e => { const c = e.target.closest(".chip"); if (c) ask(QUICK_PROMPTS[c.dataset.i][1], QUICK_PROMPTS[c.dataset.i][0]); });

function renderChat(streamingText) {
  const box = $("msgs");
  if (!chat.length && streamingText === undefined) {
    box.innerHTML = `<div class="ai-hint">Ask anything about <b>${esc(current?.title || "this note")}</b>,<br>or tap a shortcut above.</div>`;
    return;
  }
  box.innerHTML = chat.map(m => m.role === "user"
      ? `<div class="msg user">${esc(m.display || m.content)}</div>`
      : `<div class="msg ${m.error ? "err" : "bot"}">${m.error ? esc(m.content) : renderMd(m.content)}</div>`).join("")
    + (streamingText !== undefined ? `<div class="msg bot typing">${renderMd(streamingText || "")}</div>` : "");
  box.scrollTop = box.scrollHeight;
}

function systemPrompt() {
  return `You are a friendly, precise study assistant. The student is reading the note below. Answer using the note as your primary source. If the note doesn't cover something, say so briefly and then answer from general knowledge, clearly labelled. Use Markdown, keep answers focused, and prefer bullet points for lists.

NOTE TITLE: ${current.title}
NOTE FILE: ${current.file}
----- NOTE START -----
${current.content.slice(0, 24000)}
----- NOTE END -----`;
}

async function ask(text, display) {
  if (busy || !current || !text.trim()) return;
  if (!getKey() && !askForKey()) return;
  busy = true; $("sendBtn").disabled = true;
  chat.push({ role: "user", content: text, display });
  renderChat("");
  try {
    const reply = await streamGroq([{ role: "system", content: systemPrompt() }, ...chat.filter(m => !m.error).map(({ role, content }) => ({ role, content }))]);
    chat.push({ role: "assistant", content: reply });
  } catch (err) {
    chat.push({ role: "assistant", content: "⚠ " + err.message, error: true });
  }
  busy = false; $("sendBtn").disabled = false;
  renderChat();
}

async function streamGroq(messages, retried) {
  const res = await fetch(GROQ_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json", "Authorization": `Bearer ${getKey()}` },
    body: JSON.stringify({ model: GROQ_MODEL, messages, stream: true, temperature: 0.5, max_tokens: 1500 }),
  });
  if (!res.ok) {
    const body = await res.text();
    // If the default model has been retired, pick another available one and retry once.
    if (!retried && /model/i.test(body) && (res.status === 404 || res.status === 400)) {
      const alt = await pickModel();
      if (alt && alt !== GROQ_MODEL) { GROQ_MODEL = alt; return streamGroq(messages, true); }
    }
    let msg = body; try { msg = JSON.parse(body).error?.message || body; } catch {}
    throw new Error(`Groq API error (${res.status}): ${msg}`);
  }
  const reader = res.body.getReader(), dec = new TextDecoder();
  let buf = "", out = "", last = 0;
  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    const lines = buf.split("\n"); buf = lines.pop();
    for (const line of lines) {
      const t = line.trim();
      if (!t.startsWith("data:")) continue;
      const data = t.slice(5).trim();
      if (data === "[DONE]") continue;
      try { out += JSON.parse(data).choices?.[0]?.delta?.content || ""; } catch {}
    }
    if (performance.now() - last > 60) { renderChat(out); last = performance.now(); }
  }
  return out;
}

async function pickModel() {
  try {
    const r = await fetch("https://api.groq.com/openai/v1/models", { headers: { Authorization: `Bearer ${getKey()}` } });
    const ids = (await r.json()).data.map(m => m.id).filter(id => !/whisper|guard|tts|embed/i.test(id));
    return ids.find(id => /llama.*70b/i.test(id)) || ids.find(id => /gpt-oss-120b/i.test(id)) || ids.find(id => /llama/i.test(id)) || ids[0];
  } catch { return null; }
}

$("composer").addEventListener("submit", e => { e.preventDefault(); const v = $("prompt").value; $("prompt").value = ""; autosize(); ask(v); });
$("prompt").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("composer").requestSubmit(); } });
function autosize() { const t = $("prompt"); t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 140) + "px"; }
$("prompt").addEventListener("input", autosize);
$("aiClear").onclick = () => { if (!busy) { chat = []; renderChat(); } };
function setAi(open) {
  $("reader").classList.toggle("ai-closed", !open);
  try { localStorage.setItem("notesAiOpen", open ? "1" : "0"); } catch {}
}
$("aiClose").onclick = () => setAi(false);
$("aiToggle").onclick = () => setAi($("reader").classList.contains("ai-closed"));

/* ---------- Load a folder directly (no rebuild needed) ---------- */
$("openFolderBtn").onclick = () => $("folderInput").click();
$("folderInput").addEventListener("change", async e => {
  const files = [...e.target.files].filter(f => f.name.toLowerCase().endsWith(".md")).sort((a, b) => a.webkitRelativePath.localeCompare(b.webkitRelativePath));
  if (!files.length) { alert("No .md files found in that folder."); return; }
  notes = await Promise.all(files.map(async f => {
    const content = await f.text();
    const h1 = content.match(/^#\s+(.+?)\s*#*\s*$/m);
    return { file: f.webkitRelativePath.split("/").slice(1).join("/") || f.name,
             title: h1 ? h1[1].trim() : f.name.replace(/\.md$/i, "").replace(/[-_]/g, " "),
             modified: new Date(f.lastModified).toISOString().slice(0, 16), content };
  }));
  current = null; location.hash = ""; route();
});

/* ---------- Routing ---------- */
function route() {
  const m = location.hash.match(/^#\/note\/(.+)$/);
  const inNote = !!m;
  $("home").classList.toggle("hidden", inNote);
  $("reader").classList.toggle("hidden", !inNote);
  $("floatBtns").classList.toggle("hidden", !inNote);
  $("aiToggle").classList.toggle("hidden", !inNote);
  $("progress").style.width = "0";
  if (inNote) openNote(decodeURIComponent(m[1]));
  else { document.title = "Notes Hub"; $("search").value = ""; $("searchCount").textContent = ""; renderHome(); updateSearchUi(); window.scrollTo(0, 0); }
}
window.addEventListener("hashchange", route);
try { if (localStorage.getItem("notesAiOpen") === "0" || innerWidth <= 1100) setAi(false); } catch { if (innerWidth <= 1100) setAi(false); }
route();
</script>
</body>
